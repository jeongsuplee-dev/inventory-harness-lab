name: verify

# PR과 main 푸시마다 npm run verify (Prepare → Types → Lint → Test → Build)를 실행한다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치의 이전 실행은 취소한다 (PR에 새 커밋이 올라오면 오래된 검증은 필요 없다)
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # 검증 전용 값. 실제 세션 서명에 쓰이지 않는다 (CI 빌드·테스트용).
      SESSION_SECRET: ci-only-session-secret-not-for-production-use-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (Prepare → Types → Lint → Test → Build)
        run: npm run verify
